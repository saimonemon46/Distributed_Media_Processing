# =====================================================================
# Docker Compose Configuration for Distributed Media Processing System
# =====================================================================
# This file orchestrates the local deployment of the API server, the PostgreSQL
# database, the MinIO object storage, the RabbitMQ message broker, and the
# background media processing worker.
# =====================================================================

services:
  # -------------------------------------------------------------------
  # 1. API Server (FastAPI)
  # -------------------------------------------------------------------
  # Exposes REST endpoints for uploading media and polling job status.
  # It delegates work to MinIO (for storage) and RabbitMQ (for queueing).
  # -------------------------------------------------------------------
  api:
    build: .
    ports:
      - "8000:8000" # Expose FastAPI application port
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: media-bucket
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
    depends_on:
      db:
        condition: service_healthy # Wait until DB can accept connections
      minio:
        condition: service_started # Wait until MinIO is up
      rabbitmq:
        condition: service_healthy # Wait until RabbitMQ is fully initialized

  # -------------------------------------------------------------------
  # 2. Media Processing Worker
  # -------------------------------------------------------------------
  # Subscribes to the RabbitMQ queue, consumes media tasks, performs CPU-heavy
  # operations (resizing), uploads results back to MinIO, and updates PostgreSQL.
  # -------------------------------------------------------------------
  worker:
    build: .
    command: python -m app.worker.consumer # Runs the modular worker consumer
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: media-bucket
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # -------------------------------------------------------------------
  # 3. Database (PostgreSQL)
  # -------------------------------------------------------------------
  # Stores metadata for each media job (ID, status, timestamps, paths).
  # -------------------------------------------------------------------
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 4. Object Storage (MinIO)
  # -------------------------------------------------------------------
  # S3-compatible local storage representing the datastore for original and
  # processed media files.
  # -------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Admin console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  # -------------------------------------------------------------------
  # 5. Message Broker (RabbitMQ)
  # -------------------------------------------------------------------
  # Serves as the asynchronous link between the API and the Workers. It holds and
  # routes task messages reliably. Includes management UI.
  # -------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP Port
      - "15672:15672" # Management Web UI Console
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Persistent volumes for services that require state
volumes:
  postgres_data:
  minio_data:
