[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-media-processing"
version = "1.0.0"
description = "High-throughput, asynchronous distributed media processing engine using FastAPI, RabbitMQ, MinIO, and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Md. Saimon Hasan Emon" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pillow>=10.0.0",
    "pika>=1.3.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
